# Generates Practices.xcodeproj. Run `xcodegen` after changing this file.
# Source folders are synced folders, so files added in Xcode or Finder are picked up without regenerating.
name: Practices
options:
  bundleIdPrefix: com.lucasvilela
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Practices:
    type: application
    platform: iOS
    sources:
      - path: Practices
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasvilela.practices
        PRODUCT_NAME: Practices
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Practices-Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Config/Practices-Info.plist
      properties:
        CFBundleDisplayName: Tend
        UIAppFonts:
          - Geist-Light.ttf
          - Geist-Regular.ttf
          - Geist-Medium.ttf
        UILaunchScreen:
          UIColorName: Background
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIApplicationSupportsIndirectInputEvents: true
  PracticesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PracticesTests
        type: syncedFolder
    dependencies:
      - target: Practices
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasvilela.practices.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Practices.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Practices"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Practices:
    build:
      targets:
        Practices: all
        PracticesTests: [test]
    test:
      targets:
        - PracticesTests
      gatherCoverageData: false
    run:
      config: Debug
