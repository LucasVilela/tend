</style></head><body>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #111113; color: #ECEAE6; font-family: Geist, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column">

<header style="flex-shrink: 0; padding: 52px 14px 0; display: grid; grid-template-columns: 64px minmax(0, 1fr) 64px; align-items: center">
<a href="vision.html" aria-label="Close without adding" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #A3A1A7; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<h1 style="margin: 0; text-align: center; font-size: 15px; line-height: 20px; font-weight: 500">Add to board</h1>
<span aria-hidden="true"></span>
</header>

<main style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 28px">

<div role="group" aria-label="Tile type" style="padding: 3px; border: 1px solid #26262A; border-radius: 999px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px">

<button type="button" aria-pressed="false" style="height: 44px; border: 0; border-radius: 999px; background: transparent; color: #85838A; font-size: 15px; cursor: pointer">Image</button>

<button type="button" aria-pressed="true" style="height: 44px; border: 0; border-radius: 999px; background: #26262A; color: #ECEAE6; font-size: 15px; cursor: pointer">Text</button>

</div>




<div style="display: flex; flex-direction: column; gap: 28px">

<div role="group" aria-labelledby="lbl-h" style="display: flex; flex-direction: column; gap: 12px">
<span id="lbl-h" style="font-size: 14px; line-height: 18px; color: #85838A">Label</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">

<button type="button" aria-pressed="true" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #ECEAE6; background: #232327; color: #ECEAE6; font-size: 15px; cursor: pointer">Goal</button>

<button type="button" aria-pressed="false" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #2A2A2F; background: transparent; color: #A3A1A7; font-size: 15px; cursor: pointer">Mantra</button>

<button type="button" aria-pressed="false" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #2A2A2F; background: transparent; color: #A3A1A7; font-size: 15px; cursor: pointer">Words for the year</button>

<button type="button" aria-pressed="false" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #2A2A2F; background: transparent; color: #A3A1A7; font-size: 15px; cursor: pointer">Quote</button>

<button type="button" aria-pressed="false" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #2A2A2F; background: transparent; color: #A3A1A7; font-size: 15px; cursor: pointer">Reminder</button>

</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="txt" style="font-size: 14px; line-height: 18px; color: #85838A">Text</label>
<textarea id="txt" rows="2" placeholder="Something you want to do" style="border: 0; border-bottom: 1px solid #2A2A2F; background: transparent; padding: 0 0 8px; resize: none; font-size: 22px; line-height: 30px; font-weight: 300; color: #ECEAE6">Run a half marathon</textarea>
</div>


<button type="button" style="min-height: 56px; margin-top: -8px; padding: 0; border: 0; border-bottom: 1px solid #222226; background: transparent; display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left">
<span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 16px; line-height: 20px; color: #ECEAE6">By when</span>
<span style="font-size: 13px; line-height: 18px; color: #85838A">Optional · just a date to keep in mind</span>
</span>
<span style="font-size: 15px; line-height: 20px; color: #A3A1A7">May 2027</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#85838A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>


<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; line-height: 18px; color: #85838A">On your board</span>
<div aria-hidden="true" style="width: 50%; box-sizing: border-box; border-radius: 16px; background: #18181C; padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: 0.08em; color: #9CC5A1">GOAL · MAY</span>
<p style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 300; letter-spacing: -0.01em; color: #ECEAE6; overflow-wrap: anywhere">Run a half marathon</p>
</div>
</div>

</div>


</main>

<div style="flex-shrink: 0; padding: 12px 24px 32px">
<a href="vision.html" style="height: 54px; border-radius: 999px; background: #ECEAE6; color: #111113; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 500; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
Add to board
</a>
</div>
</div>
</body></html>
