<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exercise log</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&display=swap">
<style>
body{margin:0;background:#111113}
a{color:#ECEAE6}a:hover{color:#FFFFFF}
button,input,textarea{font:inherit;color:inherit}
[style*="border-radius: 50%"]:not(.anim):not(.blob-btn){border-radius:58% 42% 54% 46%/47% 55% 45% 53%!important}
[style*="border-radius: 999px"]{border-radius:26px 18px 24px 16px/18px 25px 16px 23px!important}
[style*="border-bottom: 1px solid"]{border-bottom-color:transparent!important;background-image:url(/_blob/e00e9539ee07a59e5be730af0b7432e9)!important;background-repeat:repeat-x!important;background-position:left bottom!important;background-size:96px 6px!important}
[style*="border-top: 1px solid"]{border-top-color:transparent!important;background-image:url(/_blob/e00e9539ee07a59e5be730af0b7432e9)!important;background-repeat:repeat-x!important;background-position:left top!important;background-size:96px 6px!important}
[style*="border-top: 1px solid"][style*="border-bottom: 1px solid"]{background-image:url(/_blob/e00e9539ee07a59e5be730af0b7432e9),url(/_blob/e00e9539ee07a59e5be730af0b7432e9)!important;background-position:left top,left bottom!important}
.blob-btn{animation:blobmorph 9s ease-in-out infinite}
@keyframes blobmorph{0%,100%{border-radius:56% 44% 52% 48%/48% 56% 44% 52%}50%{border-radius:46% 54% 45% 55%/55% 46% 54% 45%}}
@media (prefers-reduced-motion: reduce){.blob-btn{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #111113; color: #ECEAE6; font-family: Geist, -apple-system, 'Segoe UI', Roboto, sans-serif">
<main style="position: absolute; inset: 0; overflow-y: auto; box-sizing: border-box; padding: 64px 24px 180px; display: flex; flex-direction: column; gap: 28px">

<header style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 300; letter-spacing: -0.02em">Exercise</h1>
<p style="margin: 0; font-size: 14px; line-height: 18px; color: #85838A">30 minutes a day · 2-day streak</p>
</header>

<section aria-labelledby="week-h" style="display: flex; flex-direction: column; gap: 22px">
<h2 id="week-h" style="margin: 0; font-size: 14px; line-height: 18px; font-weight: 400; color: #85838A">Last 7 days</h2>
<dl style="margin: -12px 0 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column-reverse; gap: 2px">
<dt style="font-size: 13px; line-height: 18px; color: #85838A">active</dt>
<dd style="margin: 0; font-size: 30px; line-height: 36px; font-weight: 300; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">2h 25m</dd>
</div>
<div style="display: flex; flex-direction: column-reverse; gap: 2px">
<dt style="font-size: 13px; line-height: 18px; color: #85838A">workouts</dt>
<dd style="margin: 0; font-size: 30px; line-height: 36px; font-weight: 300; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">4</dd>
</div>
<div style="display: flex; flex-direction: column-reverse; gap: 2px">
<dt style="font-size: 13px; line-height: 18px; color: #85838A">km</dt>
<dd style="margin: 0; font-size: 30px; line-height: 36px; font-weight: 300; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">11.2</dd>
</div>
</dl>
<div role="img" aria-label="Active minutes per day against a 30 minute goal: Tuesday 38, Wednesday 0, Thursday 30, Friday 0, Saturday 45, Sunday 32, today 0" style="display: flex; flex-direction: column; gap: 10px">
<div style="position: relative; height: 80px">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 48px; border-top: 1px dashed #3A3A40"></div>
<div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); align-items: end">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
<div style="display: flex; justify-content: center; align-items: flex-end; height: 100%">
<span style="width: 6px; height: {{b.h}}px; border-radius: 3px; background: {{b.color}}"></span>
</div>
</sc-for>
</div>
</div>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
<span style="font-size: 12px; line-height: 16px; color: {{b.fg}}">{{b.label}}</span>
</sc-for>
</div>
</div>
</section>

<section aria-labelledby="workouts-h" style="display: flex; flex-direction: column; gap: 6px">
<h2 id="workouts-h" style="margin: 0; font-size: 14px; line-height: 18px; font-weight: 400; color: #85838A">Recent workouts</h2>
<ul style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{workouts}}" as="w" hint-placeholder-count="5">
<li style="min-height: 64px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #222226">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; line-height: 20px">{{w.title}}</span>
<span style="font-size: 13px; line-height: 18px; color: #85838A">{{w.meta}}</span>
</div>
<span style="font-size: 15px; line-height: 20px; color: #A3A1A7; font-variant-numeric: tabular-nums">{{w.mins}} min</span>
</li>
</sc-for>
</ul>
</section>

</main>

<a href="LogWorkout.dc.html" class="blob-btn" aria-label="Log a workout" style="position: absolute; right: 24px; bottom: 104px; width: 56px; height: 56px; border-radius: 50%; background: #9CC5A1; color: #111113; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 8px 24px rgba(0,0,0,0.5)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</a>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 8px 24px; background: #111113; border-top: 1px solid #222226; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
<a href="Main.dc.html" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #85838A; font-size: 11px; line-height: 13px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="9" cy="9" r="5.2"></circle><circle cx="15" cy="9" r="5.2"></circle><circle cx="12" cy="14.5" r="5.2"></circle></svg>
Today
</a>
<a href="Journal.dc.html" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #85838A; font-size: 11px; line-height: 13px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20v-3.5L15.5 5a2.1 2.1 0 0 1 3 0l.5.5a2.1 2.1 0 0 1 0 3L7.5 20H4z"></path><path d="M13.5 7l3.5 3.5"></path></svg>
Journal
</a>
<a href="Meditation.dc.html" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #85838A; font-size: 11px; line-height: 13px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3.5"></circle></svg>
Meditate
</a>
<a href="Exercise.dc.html" aria-current="page" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #ECEAE6; font-size: 11px; line-height: 13px; font-weight: 500">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"></path></svg>
Exercise
</a>
<a href="Vision.dc.html" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #85838A; font-size: 11px; line-height: 13px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="9" rx="1.5"></rect><rect x="13" y="4" width="7" height="5" rx="1.5"></rect><rect x="13" y="11" width="7" height="9" rx="1.5"></rect><rect x="4" y="15" width="7" height="5" rx="1.5"></rect></svg>
Vision
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var goal = 30, max = 50, chartH = 80;
    var days = [["T", 38], ["W", 0], ["T", 30], ["F", 0], ["S", 45], ["S", 32], ["M", 0]];
    var bars = days.map(function (d, i) {
      var isToday = i === days.length - 1;
      return {
        label: d[0],
        h: d[1] ? Math.round((d[1] / max) * chartH) : 6,
        color: d[1] === 0 ? "#2A2A2F" : d[1] >= goal ? "#9CC5A1" : "#4F6152",
        fg: isToday ? "#ECEAE6" : "#85838A"
      };
    });
    var list = [
      ["Easy morning run", "Sun 8 Nov · Run · 5.2 km", 32],
      ["Upper body strength", "Sat 7 Nov · Strength", 45],
      ["Vinyasa flow", "Thu 5 Nov · Yoga", 30],
      ["Tempo run", "Tue 3 Nov · Run · 6.0 km", 38],
      ["Leg day", "Mon 2 Nov · Strength", 45]
    ];
    var workouts = list.map(function (r) { return { title: r[0], meta: r[1], mins: r[2] }; });
    return { bars: bars, workouts: workouts };
  }
}
</script>
</body>
</html>
