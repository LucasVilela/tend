<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var C = { j: "#D4A373", m: "#A9A3D9", e: "#9CC5A1" };
    var soft = { j: "rgba(212,163,115,0.35)", m: "rgba(169,163,217,0.35)", e: "rgba(156,197,161,0.35)" };
    var names = ["journal", "meditation", "exercise"];
    var dows = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    // Logged days in November: [journal, meditation, exercise] — 1 done, 0.5 in progress, 0 none
    var log = {
      1: [1, 1, 0], 2: [1, 1, 1], 3: [1, 0, 1], 4: [1, 1, 0], 5: [0, 1, 1],
      6: [1, 1, 0], 7: [1, 1, 1], 8: [1, 1, 1], 9: [1, 0.5, 0]
    };
    var today = 9;
    var lead = 6; // 1 November 2026 is a Sunday; weeks start Monday
    var dot = function (v, k) {
      if (v === 1) return { bg: soft[k], bd: C[k] };
      if (v > 0) return { bg: "transparent", bd: C[k] };
      return { bg: "transparent", bd: "#2E2E33" };
    };
    var none = { bg: "transparent", bd: "transparent" };
    var cells = [];
    for (var i = 0; i < 42; i++) {
      var n = i - lead + 1;
      if (n < 1 || n > 30) {
        cells.push({ blank: true, vis: "hidden", label: "", num: "", color: "#85838A", bg: "transparent", venn: 0, j: none, m: none, e: none });
        continue;
      }
      var v = log[n];
      var isToday = n === today;
      var label = (isToday ? "Today, " : "") + dows[i % 7] + " " + n + " November";
      if (v) {
        var done = v.map(function (x, k) {
          return x === 1 ? names[k] : x > 0 ? names[k] + " in progress" : null;
        }).filter(Boolean);
        label += ": " + (done.length ? done.join(", ") : "nothing logged");
      }
      cells.push({
        blank: false,
        vis: "visible",
        label: label,
        num: n,
        color: isToday ? "#111113" : n < today ? "#ECEAE6" : "#85838A",
        bg: isToday ? "#ECEAE6" : "transparent",
        venn: v ? 1 : 0,
        j: v ? dot(v[0], "j") : none,
        m: v ? dot(v[1], "m") : none,
        e: v ? dot(v[2], "e") : none
      });
    }
    return { cells: cells };
  }
}
</script>
