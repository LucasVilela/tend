<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Journal tracker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&display=swap">
<style>
body{margin:0;background:#111113}
a{color:#ECEAE6}a:hover{color:#FFFFFF}
button,input,textarea{font:inherit;color:inherit}
[style*="border-radius: 50%"]:not(.anim):not(.blob-btn){border-radius:58% 42% 54% 46%/47% 55% 45% 53%!important}
[style*="border-radius: 999px"]{border-radius:26px 18px 24px 16px/18px 25px 16px 23px!important}
[style*="border-bottom: 1px solid"]{border-bottom-color:transparent!important;background-image:url(/_blob/e00e9539ee07a59e5be730af0b7432e9)!important;background-repeat:repeat-x!important;background-position:left bottom!important;background-size:96px 6px!important}
[style*="border-top: 1px solid"]{border-top-color:transparent!important;background-image:url(/_blob/e00e9539ee07a59e5be730af0b7432e9)!important;background-repeat:repeat-x!important;background-position:left top!important;background-size:96px 6px!important}
[style*="border-top: 1px solid"][style*="border-bottom: 1px solid"]{background-image:url(/_blob/e00e9539ee07a59e5be730af0b7432e9),url(/_blob/e00e9539ee07a59e5be730af0b7432e9)!important;background-position:left top,left bottom!important}
.blob-btn{animation:blobmorph 9s ease-in-out infinite}
@keyframes blobmorph{0%,100%{border-radius:56% 44% 52% 48%/48% 56% 44% 52%}50%{border-radius:46% 54% 45% 55%/55% 46% 54% 45%}}
@media (prefers-reduced-motion: reduce){.blob-btn{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #111113; color: #ECEAE6; font-family: Geist, -apple-system, 'Segoe UI', Roboto, sans-serif">
<main style="position: absolute; inset: 0; overflow-y: auto; box-sizing: border-box; padding: 64px 24px 180px; display: flex; flex-direction: column; gap: 28px">

<header style="display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 300; letter-spacing: -0.02em">Journal</h1>
<nav aria-label="Journal type" style="padding: 3px; border: 1px solid #26262A; border-radius: 999px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px">
<a href="Journal.dc.html" aria-current="page" style="height: 44px; border-radius: 999px; background: #26262A; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #ECEAE6; text-decoration: none">Tracker</a>
<a href="GuidedJournal.dc.html" style="height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #85838A; text-decoration: none">Guided</a>
</nav>
<p style="margin: 0; font-size: 14px; line-height: 18px; color: #85838A">Once a day · journaled today at 7:12 am</p>
</header>

<section aria-label="Streak" style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px">
<p style="margin: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 56px; line-height: 60px; font-weight: 300; letter-spacing: -0.04em; font-variant-numeric: tabular-nums">4</span>
<span style="font-size: 14px; line-height: 18px; color: #85838A">day streak</span>
</p>
<p style="margin: 0 0 2px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
<span style="font-size: 20px; line-height: 26px; font-weight: 300; font-variant-numeric: tabular-nums">8 of 9</span>
<span style="font-size: 14px; line-height: 18px; color: #85838A">days this month</span>
</p>
</section>

<section aria-labelledby="month-h" style="display: flex; flex-direction: column; gap: 10px">
<h2 id="month-h" style="margin: 0; font-size: 14px; line-height: 18px; font-weight: 400; color: #85838A">November</h2>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 12px; line-height: 16px; color: #85838A">
<span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 8px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="42">
<div style="display: flex; justify-content: center; visibility: {{c.vis}}">
<span role="img" aria-label="{{c.label}}" aria-hidden="{{c.blank}}" style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 50%; border: 1px solid {{c.bd}}; background: {{c.bg}}; display: flex; align-items: center; justify-content: center; font-size: 11px; line-height: 14px; font-variant-numeric: tabular-nums; color: {{c.fg}}">{{c.num}}</span>
</div>
</sc-for>
</div>
</section>

<section aria-labelledby="recent-h" style="display: flex; flex-direction: column; gap: 6px">
<h2 id="recent-h" style="margin: 0; font-size: 14px; line-height: 18px; font-weight: 400; color: #85838A">Check-ins</h2>
<ul style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{logs}}" as="l" hint-placeholder-count="6">
<li style="min-height: 60px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #222226">
<span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #D4A373"></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; line-height: 20px">{{l.day}}</span>
<span style="font-size: 13px; line-height: 18px; color: #85838A">{{l.meta}}</span>
</div>
<span style="display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 18px; color: {{l.f.color}}">{{l.f.name}}<span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 50%; background: {{l.f.color}}; display: block; flex-shrink: 0"><svg width="24" height="24" viewBox="0 0 100 100" aria-hidden="true" style="overflow: visible; display: block"><ellipse cx="26" cy="56" rx="8" ry="4.5" fill="rgba(226,104,92,0.5)" opacity="{{l.f.cheeks}}"></ellipse><ellipse cx="74" cy="56" rx="8" ry="4.5" fill="rgba(226,104,92,0.5)" opacity="{{l.f.cheeks}}"></ellipse><path d="{{l.f.brows}}" fill="none" stroke="#1A1A1F" stroke-width="5" stroke-linecap="round"></path><path d="{{l.f.eyes}}" fill="none" stroke="#1A1A1F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{l.f.eyeFill}}" fill="#1A1A1F"></path><path d="{{l.f.mouth}}" fill="none" stroke="#1A1A1F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{l.f.mouthFill}}" fill="#1A1A1F"></path><path d="{{l.f.extra}}" fill="none" stroke="#1A1A1F" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{l.f.extraFill}}" fill="{{l.f.extraFillColor}}"></path></svg></span></span>
</li>
</sc-for>
</ul>
</section>

</main>

<a href="JournalEntry.dc.html" class="blob-btn" aria-label="Log journaling" style="position: absolute; right: 24px; bottom: 104px; width: 56px; height: 56px; border-radius: 50%; background: #D4A373; color: #111113; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 8px 24px rgba(0,0,0,0.5)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</a>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 8px 24px; background: #111113; border-top: 1px solid #222226; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
<a href="Main.dc.html" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #85838A; font-size: 11px; line-height: 13px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="9" cy="9" r="5.2"></circle><circle cx="15" cy="9" r="5.2"></circle><circle cx="12" cy="14.5" r="5.2"></circle></svg>
Today
</a>
<a href="Journal.dc.html" aria-current="page" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #ECEAE6; font-size: 11px; line-height: 13px; font-weight: 500">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20v-3.5L15.5 5a2.1 2.1 0 0 1 3 0l.5.5a2.1 2.1 0 0 1 0 3L7.5 20H4z"></path><path d="M13.5 7l3.5 3.5"></path></svg>
Journal
</a>
<a href="Meditation.dc.html" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #85838A; font-size: 11px; line-height: 13px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3.5"></circle></svg>
Meditate
</a>
<a href="Exercise.dc.html" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #85838A; font-size: 11px; line-height: 13px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"></path></svg>
Exercise
</a>
<a href="Vision.dc.html" style="min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #85838A; font-size: 11px; line-height: 13px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="9" rx="1.5"></rect><rect x="13" y="4" width="7" height="5" rx="1.5"></rect><rect x="13" y="11" width="7" height="9" rx="1.5"></rect><rect x="4" y="15" width="7" height="5" rx="1.5"></rect></svg>
Vision
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var dows = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    var done = { 1: 1, 2: 1, 3: 1, 4: 1, 6: 1, 7: 1, 8: 1, 9: 1 };
    var today = 9, lead = 6; // 1 November 2026 is a Sunday; weeks start Monday
    var cells = [];
    for (var i = 0; i < 42; i++) {
      var n = i - lead + 1;
      if (n < 1 || n > 30) {
        cells.push({ blank: true, vis: "hidden", num: "", label: "", bg: "transparent", bd: "transparent", fg: "#85838A" });
        continue;
      }
      var isDone = !!done[n], past = n <= today;
      cells.push({
        blank: false,
        vis: "visible",
        num: n,
        label: (n === today ? "Today, " : "") + dows[i % 7] + " " + n + " November: " + (isDone ? "journaled" : past ? "missed" : "upcoming"),
        bg: isDone ? "#D4A373" : "transparent",
        bd: isDone ? "#D4A373" : past ? "#3A3A40" : "#222226",
        fg: isDone ? "#111113" : past ? "#A3A1A7" : "#85838A"
      });
    }
    // Same face library as Mood (only the moods used here).
    var FACES = {
      happy: { name: "Happy", color: "#F2D27A", cheeks: 1, eyeFill: "M33 42a3.5 4.5 0 1 0 7 0a3.5 4.5 0 1 0 -7 0M60 42a3.5 4.5 0 1 0 7 0a3.5 4.5 0 1 0 -7 0", mouth: "M34 59Q50 76 66 59" },
      calm: { name: "Calm", color: "#8FBCD9", cheeks: 0.6, eyes: "M30 44Q36 49 42 44M58 44Q64 49 70 44", mouth: "M41 62Q50 68 59 62" },
      grateful: { name: "Grateful", color: "#F2B482", cheeks: 1, eyes: "M30 45Q36 39 42 45M58 45Q64 39 70 45", mouth: "M40 60Q50 70 60 60", extraFill: "M82 16c-2.5-4-9-2.5-8.3 2.5.6 4.3 8.3 8.5 8.3 8.5s7.7-4.2 8.3-8.5c.7-5-5.8-6.5-8.3-2.5z", extraFillColor: "#E2685C" },
      bleh: { name: "Bleh", color: "#ABA98E", eyes: "M30 42h12M58 42h12", eyeFill: "M32.5 43a3.5 3 0 0 0 7 0zM60.5 43a3.5 3 0 0 0 7 0z", mouth: "M38 64L62 60" },
      badsleep: { name: "Bad sleep", color: "#9497C2", eyes: "M30 43Q36 47 42 43M58 43Q64 47 70 43M32 51Q36 53.5 40 51M60 51Q64 53.5 68 51", mouthFill: "M45.5 65a4.5 5.5 0 1 0 9 0a4.5 5.5 0 1 0 -9 0", extra: "M68 20h7l-7 8h7M79 11h5l-5 6h5" },
      anxious: { name: "Anxious", color: "#8DCBBE", brows: "M29 31Q35 27 42 30M71 31Q65 27 58 30", eyes: "M31 42a5.5 5.5 0 1 0 11 0a5.5 5.5 0 1 0 -11 0M58 42a5.5 5.5 0 1 0 11 0a5.5 5.5 0 1 0 -11 0", eyeFill: "M34.8 43a1.8 1.8 0 1 0 3.6 0a1.8 1.8 0 1 0 -3.6 0M61.8 43a1.8 1.8 0 1 0 3.6 0a1.8 1.8 0 1 0 -3.6 0", mouth: "M35 64q3.75-4 7.5 0t7.5 0t7.5 0t7.5 0", extraFill: "M84 26c-3 5-4.5 7.5-4.5 9.5a4.5 4.5 0 0 0 9 0c0-2-1.5-4.5-4.5-9.5z", extraFillColor: "#EAF6F3" }
    };
    var faceOf = function (k) {
      var x = FACES[k];
      return { key: k, name: x.name, color: x.color, cheeks: x.cheeks || 0, brows: x.brows || "", eyes: x.eyes || "", eyeFill: x.eyeFill || "", mouth: x.mouth || "", mouthFill: x.mouthFill || "", extra: x.extra || "", extraFill: x.extraFill || "", extraFillColor: x.extraFillColor || "#1A1A1F" };
    };
    var logs = [
      ["Today", "7:12 am · 15 min", "badsleep"],
      ["Sun 8 Nov", "9:40 pm · 10 min", "happy"],
      ["Sat 7 Nov", "6:15 pm · 20 min", "grateful"],
      ["Fri 6 Nov", "10:05 pm · 5 min", "anxious"],
      ["Wed 4 Nov", "8:30 pm · 10 min", "bleh"],
      ["Tue 3 Nov", "7:50 am · 15 min", "calm"]
    ].map(function (r) { return { day: r[0], meta: r[1], f: faceOf(r[2]) }; });
    return { cells: cells, logs: logs };
  }
}
</script>
</body>
</html>
