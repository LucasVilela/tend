<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log a workout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&display=swap">
<style>
body{margin:0;background:#111113}
a{color:#ECEAE6}a:hover{color:#FFFFFF}
button,input,textarea{font:inherit;color:inherit}
[style*="border-radius: 50%"]:not(.anim):not(.blob-btn){border-radius:58% 42% 54% 46%/47% 55% 45% 53%!important}
[style*="border-radius: 999px"]{border-radius:26px 18px 24px 16px/18px 25px 16px 23px!important}
[style*="border-bottom: 1px solid"]{border-bottom-color:transparent!important;background-image:url(/_blob/e00e9539ee07a59e5be730af0b7432e9)!important;background-repeat:repeat-x!important;background-position:left bottom!important;background-size:96px 6px!important}
[style*="border-top: 1px solid"]{border-top-color:transparent!important;background-image:url(/_blob/e00e9539ee07a59e5be730af0b7432e9)!important;background-repeat:repeat-x!important;background-position:left top!important;background-size:96px 6px!important}
[style*="border-top: 1px solid"][style*="border-bottom: 1px solid"]{background-image:url(/_blob/e00e9539ee07a59e5be730af0b7432e9),url(/_blob/e00e9539ee07a59e5be730af0b7432e9)!important;background-position:left top,left bottom!important}
.blob-btn{animation:blobmorph 9s ease-in-out infinite}
@keyframes blobmorph{0%,100%{border-radius:56% 44% 52% 48%/48% 56% 44% 52%}50%{border-radius:46% 54% 45% 55%/55% 46% 54% 45%}}
[style*="border-width: 0px 0px 1px"]{border-bottom-color:transparent!important;background-image:url(/_blob/e00e9539ee07a59e5be730af0b7432e9)!important;background-repeat:repeat-x!important;background-position:left bottom!important;background-size:96px 6px!important}
[style*="border-width: 1px 0px;"]{border-top-color:transparent!important;border-bottom-color:transparent!important;background-image:url(/_blob/e00e9539ee07a59e5be730af0b7432e9),url(/_blob/e00e9539ee07a59e5be730af0b7432e9)!important;background-repeat:repeat-x!important;background-position:left top,left bottom!important;background-size:96px 6px!important}
@media (prefers-reduced-motion: reduce){.blob-btn{animation:none}}
input::placeholder,textarea::placeholder{color:#85838A;opacity:1}
input:focus,textarea:focus{outline:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #111113; color: #ECEAE6; font-family: Geist, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column">

<header style="flex-shrink: 0; padding: 52px 14px 0; display: grid; grid-template-columns: 64px minmax(0, 1fr) 64px; align-items: center">
<a href="Exercise.dc.html" aria-label="Close without saving" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #A3A1A7; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<h1 style="margin: 0; text-align: center; font-size: 15px; line-height: 20px; font-weight: 500">Log workout</h1>
<span aria-hidden="true"></span>
</header>

<main style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 24px 24px 24px; display: flex; flex-direction: column; gap: 30px">

<section role="group" aria-labelledby="type-h" style="display: flex; flex-direction: column; gap: 12px">
<h2 id="type-h" style="margin: 0; font-size: 14px; line-height: 18px; font-weight: 400; color: #85838A">Type</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{types}}" as="t" hint-placeholder-count="6">
<button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid {{t.bd}}; background: {{t.bg}}; color: {{t.fg}}; font-size: 15px; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>
</section>

<section role="group" aria-labelledby="dur-h" style="display: flex; flex-direction: column; gap: 12px">
<h2 id="dur-h" style="margin: 0; font-size: 14px; line-height: 18px; font-weight: 400; color: #85838A">Duration</h2>
<div style="display: flex; align-items: center; justify-content: space-between">
<button type="button" aria-label="5 minutes less" onClick="{{less}}" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #2E2E33; background: transparent; color: #ECEAE6; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
</button>
<p aria-live="polite" style="margin: 0; display: flex; align-items: baseline; gap: 6px">
<span style="font-size: 56px; line-height: 60px; font-weight: 300; letter-spacing: -0.04em; font-variant-numeric: tabular-nums">{{mins}}</span>
<span style="font-size: 15px; color: #85838A">min</span>
</p>
<button type="button" aria-label="5 minutes more" onClick="{{more}}" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #2E2E33; background: transparent; color: #ECEAE6; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
</section>

<section role="group" aria-labelledby="int-h" style="display: flex; flex-direction: column; gap: 12px">
<h2 id="int-h" style="margin: 0; font-size: 14px; line-height: 18px; font-weight: 400; color: #85838A">Intensity</h2>
<div style="padding: 3px; border-radius: 999px; border: 1px solid #26262A; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px">
<sc-for list="{{levels}}" as="l" hint-placeholder-count="3">
<button type="button" aria-pressed="{{l.pressed}}" onClick="{{l.pick}}" style="height: 44px; border: 0; border-radius: 999px; background: {{l.bg}}; color: {{l.fg}}; font-size: 15px; cursor: pointer">{{l.label}}</button>
</sc-for>
</div>
</section>

<sc-if value="{{hasDistance}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="distance" style="font-size: 14px; line-height: 18px; color: #85838A">Distance</label>
<div style="display: flex; align-items: baseline; gap: 8px; border-bottom: 1px solid #2A2A2F; padding-bottom: 8px">
<input id="distance" type="text" inputmode="decimal" placeholder="0.0" value="{{distance}}" onChange="{{onDistance}}" style="flex: 1; min-width: 0; height: 36px; border: 0; background: transparent; padding: 0; font-size: 24px; font-weight: 300; font-variant-numeric: tabular-nums">
<span style="font-size: 15px; color: #85838A">km</span>
</div>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="notes" style="font-size: 14px; line-height: 18px; color: #85838A">Notes</label>
<textarea id="notes" rows="3" placeholder="How did it feel?" value="{{notes}}" onChange="{{onNotes}}" style="border: 0; border-bottom: 1px solid #2A2A2F; background: transparent; padding: 0 0 8px; resize: none; font-size: 16px; line-height: 24px; color: #ECEAE6"></textarea>
</div>

</main>

<div style="flex-shrink: 0; padding: 12px 24px 32px">
<a href="Exercise.dc.html" style="height: 54px; border-radius: 999px; background: #9CC5A1; color: #111113; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 500; text-decoration: none">Save workout</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    var type = s.type || "Run";
    var mins = s.mins != null ? s.mins : 30;
    var level = s.level || "Moderate";
    var types = ["Run", "Walk", "Strength", "Yoga", "Cycle", "Other"].map(function (t) {
      var on = t === type;
      return {
        label: t, pressed: on,
        bg: on ? "#232327" : "transparent",
        bd: on ? "#9CC5A1" : "#2A2A2F",
        fg: on ? "#ECEAE6" : "#A3A1A7",
        pick: function () { self.setState({ type: t }); }
      };
    });
    var levels = ["Easy", "Moderate", "Hard"].map(function (l) {
      var on = l === level;
      return {
        label: l, pressed: on,
        bg: on ? "#26262A" : "transparent",
        fg: on ? "#ECEAE6" : "#85838A",
        pick: function () { self.setState({ level: l }); }
      };
    });
    return {
      types: types,
      levels: levels,
      mins: mins,
      less: function () { self.setState({ mins: Math.max(5, mins - 5) }); },
      more: function () { self.setState({ mins: Math.min(300, mins + 5) }); },
      hasDistance: type === "Run" || type === "Walk" || type === "Cycle",
      distance: s.distance || "",
      onDistance: function (e) { self.setState({ distance: e.target.value }); },
      notes: s.notes || "",
      onNotes: function (e) { self.setState({ notes: e.target.value }); }
    };
  }
}
</script>
</body>
</html>
