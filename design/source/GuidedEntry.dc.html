<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Answer a template</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&display=swap">
<style>
body{margin:0;background:#111113}
a{color:#ECEAE6}a:hover{color:#FFFFFF}
button,input,textarea{font:inherit;color:inherit}
[style*="border-radius: 50%"]:not(.anim):not(.blob-btn){border-radius:58% 42% 54% 46%/47% 55% 45% 53%!important}
[style*="border-radius: 999px"]{border-radius:26px 18px 24px 16px/18px 25px 16px 23px!important}
[style*="border-bottom: 1px solid"]{border-bottom-color:transparent!important;background-image:url(/_blob/e00e9539ee07a59e5be730af0b7432e9)!important;background-repeat:repeat-x!important;background-position:left bottom!important;background-size:96px 6px!important}
[style*="border-top: 1px solid"]{border-top-color:transparent!important;background-image:url(/_blob/e00e9539ee07a59e5be730af0b7432e9)!important;background-repeat:repeat-x!important;background-position:left top!important;background-size:96px 6px!important}
[style*="border-top: 1px solid"][style*="border-bottom: 1px solid"]{background-image:url(/_blob/e00e9539ee07a59e5be730af0b7432e9),url(/_blob/e00e9539ee07a59e5be730af0b7432e9)!important;background-position:left top,left bottom!important}
.blob-btn{animation:blobmorph 9s ease-in-out infinite}
@keyframes blobmorph{0%,100%{border-radius:56% 44% 52% 48%/48% 56% 44% 52%}50%{border-radius:46% 54% 45% 55%/55% 46% 54% 45%}}
[style*="border-width: 0px 0px 1px"]{border-bottom-color:transparent!important;background-image:url(/_blob/e00e9539ee07a59e5be730af0b7432e9)!important;background-repeat:repeat-x!important;background-position:left bottom!important;background-size:96px 6px!important}
[style*="border-width: 1px 0px;"]{border-top-color:transparent!important;border-bottom-color:transparent!important;background-image:url(/_blob/e00e9539ee07a59e5be730af0b7432e9),url(/_blob/e00e9539ee07a59e5be730af0b7432e9)!important;background-repeat:repeat-x!important;background-position:left top,left bottom!important;background-size:96px 6px!important}
@media (prefers-reduced-motion: reduce){.blob-btn{animation:none}}
textarea::placeholder{color:#85838A;opacity:1}
textarea:focus{outline:none;border-bottom-color:#D4A373}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #111113; color: #ECEAE6; font-family: Geist, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column">

<header style="flex-shrink: 0; padding: 52px 14px 0; display: grid; grid-template-columns: 64px minmax(0, 1fr) 64px; align-items: center">
<a href="GuidedJournal.dc.html" aria-label="Close without saving" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #A3A1A7; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<span style="text-align: center; font-size: 13px; line-height: 18px; color: #85838A">Mon 9 Nov · 8:40 pm</span>
<span aria-hidden="true"></span>
</header>

<main style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 28px">

<div style="display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 300; letter-spacing: -0.02em">Evening reflection</h1>
<div role="progressbar" aria-label="Questions answered" aria-valuemin="0" aria-valuemax="4" aria-valuenow="{{answered}}" style="display: flex; align-items: center; gap: 10px">
<span style="flex: 1; display: flex; gap: 4px">
<sc-for list="{{segments}}" as="g" hint-placeholder-count="4">
<span style="flex: 1; height: 3px; border-radius: 2px; background: {{g.bg}}; transition: background .25s"></span>
</sc-for>
</span>
<span style="font-size: 12px; line-height: 16px; color: #85838A; font-variant-numeric: tabular-nums">{{answered}} of 4</span>
</div>
</div>

<sc-for list="{{questions}}" as="q" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="{{q.id}}" style="display: flex; gap: 10px; font-size: 18px; line-height: 26px; font-weight: 300; color: #ECEAE6">
<span style="font-size: 13px; line-height: 26px; color: #D4A373; font-variant-numeric: tabular-nums">{{q.n}}</span>
{{q.text}}
</label>
<textarea id="{{q.id}}" rows="2" placeholder="Your answer…" value="{{q.value}}" onChange="{{q.onChange}}" style="margin-left: 22px; min-height: 52px; border: 0; border-bottom: 1px solid #2A2A2F; background: transparent; padding: 0 0 8px; resize: none; font-size: 16px; line-height: 24px; color: #ECEAE6"></textarea>
</div>
</sc-for>

</main>

<div style="flex-shrink: 0; padding: 12px 24px 32px">
<a href="GuidedJournal.dc.html" style="height: 54px; border-radius: 999px; background: #D4A373; color: #111113; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 500; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
Save answers
</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    var texts = ["What went well today?", "What was hard?", "What did I learn?", "One thing for tomorrow?"];
    var a = s.answers || ["Finished the report a day early.", "", "", ""];
    var answered = a.filter(function (x) { return x && x.trim(); }).length;
    var questions = texts.map(function (t, i) {
      return {
        id: "q" + (i + 1), n: i + 1, text: t, value: a[i] || "",
        onChange: function (e) {
          var next = a.slice(); next[i] = e.target.value;
          self.setState({ answers: next });
        }
      };
    });
    var segments = texts.map(function (t, i) {
      return { bg: a[i] && a[i].trim() ? "#D4A373" : "#2A2A2F" };
    });
    return { questions: questions, segments: segments, answered: answered };
  }
}
</script>
</body>
</html>
