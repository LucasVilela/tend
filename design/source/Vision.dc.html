<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vision board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&display=swap">
<style>
body{margin:0;background:#111113}
a{color:#ECEAE6}a:hover{color:#FFFFFF}
button,input,textarea{font:inherit;color:inherit}
[style*="border-radius: 50%"]:not(.anim):not(.blob-btn){border-radius:58% 42% 54% 46%/47% 55% 45% 53%!important}
[style*="border-radius: 999px"]{border-radius:26px 18px 24px 16px/18px 25px 16px 23px!important}
[style*="border-radius: 16px"]{border-radius:20px 13px 18px 12px/14px 19px 12px 17px!important}
[style*="border-bottom: 1px solid"]{border-bottom-color:transparent!important;background-image:url(/_blob/e00e9539ee07a59e5be730af0b7432e9)!important;background-repeat:repeat-x!important;background-position:left bottom!important;background-size:96px 6px!important}
[style*="border-top: 1px solid"]{border-top-color:transparent!important;background-image:url(/_blob/e00e9539ee07a59e5be730af0b7432e9)!important;background-repeat:repeat-x!important;background-position:left top!important;background-size:96px 6px!important}
[style*="border-top: 1px solid"][style*="border-bottom: 1px solid"]{background-image:url(/_blob/e00e9539ee07a59e5be730af0b7432e9),url(/_blob/e00e9539ee07a59e5be730af0b7432e9)!important;background-position:left top,left bottom!important}
.blob-btn{animation:blobmorph 9s ease-in-out infinite}
@keyframes blobmorph{0%,100%{border-radius:56% 44% 52% 48%/48% 56% 44% 52%}50%{border-radius:46% 54% 45% 55%/55% 46% 54% 45%}}
@media (prefers-reduced-motion: reduce){.blob-btn{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #111113; color: #ECEAE6; font-family: Geist, -apple-system, 'Segoe UI', Roboto, sans-serif">
<main style="position: absolute; inset: 0; overflow-y: auto; box-sizing: border-box; padding: 64px 20px 180px; display: flex; flex-direction: column; gap: 20px">

<header style="padding: 0 4px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 300; letter-spacing: -0.02em">Vision</h1>
<p style="margin: 0; font-size: 14px; line-height: 18px; color: #85838A">A page to look at and remember</p>
</div>
<button type="button" aria-pressed="{{editing}}" onClick="{{toggleEdit}}" style="height: 44px; margin-right: -8px; padding: 0 8px; border: 0; background: transparent; font-size: 15px; color: {{editColor}}; cursor: pointer">{{editLabel}}</button>
</header>

<div style="display: flex; gap: 10px; align-items: flex-start">

<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">

<sc-if value="{{show.mountains}}" hint-placeholder-val="{{true}}">
<figure style="position: relative; margin: 0; height: 250px; border-radius: 16px; overflow: hidden; background: #18181C; outline: {{outline}}; outline-offset: -1px">
<img src="/_blob/6556962aaf04a0517f8a11951403f04f" alt="Mountains at dusk" style="width: 100%; height: 100%; object-fit: cover; display: block">
<figcaption style="position: absolute; left: 0; right: 0; bottom: 0; padding: 32px 12px 11px; background: linear-gradient(to top, rgba(10,10,12,0.8), rgba(10,10,12,0)); display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 14px; line-height: 18px; font-weight: 500; color: #FFFFFF">Hike the Overland Track</span>
<span style="font-size: 12px; line-height: 16px; color: #DAD8D3">By February</span>
</figcaption>
<sc-if value="{{editing}}" hint-placeholder-val="{{false}}">
<button type="button" aria-label="Remove Hike the Overland Track" onClick="{{rm.mountains}}" style="position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 26px; height: 26px; border-radius: 50%; background: rgba(17,17,19,0.8); color: #ECEAE6; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span></button>
</sc-if>
</figure>
</sc-if>

<sc-if value="{{show.meditate}}" hint-placeholder-val="{{true}}">
<section aria-label="Goal: Meditate 100 days" style="position: relative; border-radius: 16px; background: #18181C; padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 8px; outline: {{outline}}; outline-offset: -1px">
<span style="font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: 0.08em; color: #A9A3D9">GOAL</span>
<p style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 300; letter-spacing: -0.01em">Meditate 100 days</p>
<sc-if value="{{editing}}" hint-placeholder-val="{{false}}">
<button type="button" aria-label="Remove Meditate 100 days" onClick="{{rm.meditate}}" style="position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 26px; height: 26px; border-radius: 50%; background: #2A2A2F; color: #ECEAE6; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span></button>
</sc-if>
</section>
</sc-if>

<sc-if value="{{show.night}}" hint-placeholder-val="{{true}}">
<figure style="position: relative; margin: 0; height: 200px; border-radius: 16px; overflow: hidden; background: #18181C; outline: {{outline}}; outline-offset: -1px">
<img src="/_blob/81bd7581105d35ed539c3a25e725fa54" alt="Tent under a starry sky" style="width: 100%; height: 100%; object-fit: cover; display: block">
<figcaption style="position: absolute; left: 0; right: 0; bottom: 0; padding: 32px 12px 11px; background: linear-gradient(to top, rgba(10,10,12,0.8), rgba(10,10,12,0)); display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 14px; line-height: 18px; font-weight: 500; color: #FFFFFF">Sleep under the stars</span>

<sc-if value="{{editing}}" hint-placeholder-val="{{false}}">
<button type="button" aria-label="Remove Sleep under the stars" onClick="{{rm.night}}" style="position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 26px; height: 26px; border-radius: 50%; background: rgba(17,17,19,0.8); color: #ECEAE6; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span></button>
</sc-if>
</figure>
</sc-if>

</div>

<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">

<sc-if value="{{show.mantra}}" hint-placeholder-val="{{true}}">
<section aria-label="Mantra" style="position: relative; border-radius: 16px; background: #18181C; padding: 14px; display: flex; flex-direction: column; gap: 8px; outline: {{outline}}; outline-offset: -1px">
<span style="font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: 0.08em; color: #85838A">MANTRA</span>
<p style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 300; letter-spacing: -0.01em; color: #D4A373">Calm mind, strong body.</p>
<sc-if value="{{editing}}" hint-placeholder-val="{{false}}">
<button type="button" aria-label="Remove mantra" onClick="{{rm.mantra}}" style="position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 26px; height: 26px; border-radius: 50%; background: #2A2A2F; color: #ECEAE6; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span></button>
</sc-if>
</section>
</sc-if>

<sc-if value="{{show.ocean}}" hint-placeholder-val="{{true}}">
<figure style="position: relative; margin: 0; height: 116px; border-radius: 16px; overflow: hidden; background: #18181C; outline: {{outline}}; outline-offset: -1px">

<sc-if value="{{show.run}}" hint-placeholder-val="{{true}}">

<span style="font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: 0.08em; color: #9CC5A1">GOAL · MAY</span>
<p style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 300; letter-spacing: -0.01em">Run a half marathon</p>

<button type="button" aria-label="Remove Run a half marathon" onClick="{{rm.run}}" style="position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 26px; height: 26px; border-radius: 50%; background: #2A2A2F; color: #ECEAE6; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span></button>
</sc-if>
</section>
</sc-if>

<sc-if value="{{show.forest}}" hint-placeholder-val="{{true}}">
<figure style="position: relative; margin: 0; height: 140px; border-radius: 16px; overflow: hidden; background: #18181C; outline: {{outline}}; outline-offset: -1px">
<img src="/_blob/65ddeb679aa8730e8bdaf41fe79e88c3" alt="Misty pine forest" style="width: 100%; height: 100%; object-fit: cover; display: block">
<figcaption style="position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 12px 10px; background: linear-gradient(to top, rgba(10,10,12,0.8), rgba(10,10,12,0)); display: flex; flex-direction: column">
<span style="font-size: 14px; line-height: 18px; font-weight: 500; color: #FFFFFF">Weekends outside</span>
</figcaption>
<sc-if value="{{editing}}" hint-placeholder-val="{{false}}">
<button type="button" aria-label="Remove Weekends outside" onClick="{{rm.forest}}" style="position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 26px; height: 26px; border-radius: 50%; background: rgba(17,17,19,0.8); color: #ECEAE6; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span></button>
</sc-if>
</figure>
</sc-if>

<sc-if value="{{show.words}}" hint-placeholder-val="{{true}}">
<section aria-label="Words for the year" style="position: relative; border-radius: 16px; background: #18181C; padding: 14px; display: flex; flex-direction: column; gap: 8px; outline: {{outline}}; outline-offset: -1px">
<span style="font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: 0.08em; color: #85838A">WORDS FOR THE YEAR</span>
<p style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 300">Steady · Present · Kind</p>
<sc-if value="{{editing}}" hint-placeholder-val="{{false}}">
<button type="button" aria-label="Remove words for the year" onClick="{{rm.words}}" style="position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 26px; height: 26px; border-radius: 50%; background: #2A2A2F; color: #ECEAE6; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span></button>
</sc-if>

</sc-if>

</div>
</div>
</main>

</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    var editing = !!s.editing;
    var removed = s.removed || {};
    var keys = ["mountains", "meditate", "night", "mantra", "ocean", "run", "forest", "words"];
    var show = {}, rm = {};
    keys.forEach(function (k) {
      show[k] = !removed[k];
      rm[k] = function () { var r = Object.assign({}, removed); r[k] = true; self.setState({ removed: r }); };
    });
    // Look-and-remember only: nothing on this page is tracked.
    return {
      editing: editing,
      editLabel: editing ? "Done" : "Edit",
      editColor: editing ? "#ECEAE6" : "#A3A1A7",
      toggleEdit: function () { self.setState({ editing: !editing }); },
      outline: editing ? "1px dashed #3A3A40" : "0 solid transparent",
      show: show, rm: rm
    };
  }
}
</script>
