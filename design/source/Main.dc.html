    };
    var status = function (v, done, partial, none) { return v >= 1 ? done : v > 0 ? partial : none; };
    var doneCount = ["j", "m", "e"].filter(function (k) { return f[k] >= 1; }).length;
    var vToday = function (v) { return v >= 1 ? 1 : v > 0 ? 0.5 : 0; };

    var jStatus = status(f.j, "Done · 7:12 am", "Started", "Not yet");
    var mStatus = status(f.m, "Done", "10 of 15 min", "0 of 15 min");
    var eStatus = status(f.e, "Done", "Under 30 min", "0 of 30 min");
    var statusOf = { j: jStatus, m: mStatus, e: eStatus };

    var defs = [
      { k: "j", name: "Journal", left: 10, top: 12, color: "#F2B482", tint: "rgba(242,180,130,0.08)", faceL: 20, faceT: 44, delay: 0, bobDur: 5.4 },
      { k: "m", name: "Meditation", left: 102, top: 12, color: "#B9B0F7", tint: "rgba(185,176,247,0.08)", faceL: 62, faceT: 54, delay: -2, bobDur: 6.1 },
      { k: "e", name: "Exercise", left: 66, top: 92, color: "#A6E0AE", tint: "rgba(166,224,174,0.06)", faceL: 42, faceT: 72, delay: -4, bobDur: 5.8 }
    ];
    var blobs = defs.map(function (d) {
      var v = f[d.k];
      var pops = s["p" + d.k] || 0;
      return {
        left: d.left, top: d.top, color: d.color, faceL: d.faceL, faceT: d.faceT,
        delay: d.delay, bobDur: d.bobDur,
        tint: v > 0 ? "transparent" : d.tint,
        fill: (v * 100).toFixed(1),
        borderStyle: v > 0 ? "solid" : "dashed",
        ink: v > 0 ? "#1A1A1F" : d.color,
        happy: v >= 1,
        calm: v > 0 && v < 1,
        sleepy: v <= 0,
        pop: pops ? (pops % 2 ? "popA" : "popB") + " .7s ease-out" : "none",
        aria: d.name + ": " + statusOf[d.k] + ". Tap to fill.",
        tap: function () {
          var next = v >= 1 ? (def[d.k] >= 1 ? 0 : def[d.k]) : 1;
          var u = {}; u[d.k] = next; u["p" + d.k] = pops + 1;
          self.setState(u);
        }
      };
    });

    // Mood faces — same library on Today, Mood and Log journaling. Drawn in a 100×100 box.
    var FACES = {
      happy: { name: "Happy", color: "#F2D27A", cheeks: 1, eyeFill: "M33 42a3.5 4.5 0 1 0 7 0a3.5 4.5 0 1 0 -7 0M60 42a3.5 4.5 0 1 0 7 0a3.5 4.5 0 1 0 -7 0", mouth: "M34 59Q50 76 66 59" },
      calm: { name: "Calm", color: "#8FBCD9", cheeks: 0.6, eyes: "M30 44Q36 49 42 44M58 44Q64 49 70 44", mouth: "M41 62Q50 68 59 62" },
      anxious: { name: "Anxious", color: "#8DCBBE", brows: "M29 31Q35 27 42 30M71 31Q65 27 58 30", eyes: "M31 42a5.5 5.5 0 1 0 11 0a5.5 5.5 0 1 0 -11 0M58 42a5.5 5.5 0 1 0 11 0a5.5 5.5 0 1 0 -11 0", eyeFill: "M34.8 43a1.8 1.8 0 1 0 3.6 0a1.8 1.8 0 1 0 -3.6 0M61.8 43a1.8 1.8 0 1 0 3.6 0a1.8 1.8 0 1 0 -3.6 0", mouth: "M35 64q3.75-4 7.5 0t7.5 0t7.5 0t7.5 0", extraFill: "M84 26c-3 5-4.5 7.5-4.5 9.5a4.5 4.5 0 0 0 9 0c0-2-1.5-4.5-4.5-9.5z", extraFillColor: "#EAF6F3" },
      bleh: { name: "Bleh", color: "#ABA98E", eyes: "M30 42h12M58 42h12", eyeFill: "M32.5 43a3.5 3 0 0 0 7 0zM60.5 43a3.5 3 0 0 0 7 0z", mouth: "M38 64L62 60" }
    };
    var faceOf = function (k) {
      var x = FACES[k];
      return { key: k, name: x.name, color: x.color, cheeks: x.cheeks || 0, brows: x.brows || "", eyes: x.eyes || "", eyeFill: x.eyeFill || "", mouth: x.mouth || "", mouthFill: x.mouthFill || "", extra: x.extra || "", extraFill: x.extraFill || "", extraFillColor: x.extraFillColor || "#1A1A1F" };
    };
    // Four quick faces here; all 12 moods live on the Mood screen (the + button).
    var quick = ["happy", "calm", "anxious", "bleh"];
    var mood = s.mood !== undefined ? s.mood : "calm";
    var moods = quick.map(function (k) {
      var on = k === mood;
      var fc = faceOf(k);
      return {
        f: fc, pressed: on, aria: "Log mood: " + fc.name,
        op: mood && !on ? 0.6 : 1,
        scale: on ? 1.12 : 1,
        ring: on ? "0 0 0 2px #111113, 0 0 0 3.5px " + fc.color : "none",
        pick: function () { self.setState({ mood: on ? null : k, moodNow: !on }); }
      };
    });
    var moodStatus = mood ? FACES[mood].name + " · " + (s.moodNow ? "just now" : "1:15 pm") : "How are you feeling?";

    var tapOf = {};
    defs.forEach(function (d, i) { tapOf[d.k] = blobs[i].tap; });
    var faceFor = {
      done: { eyes: "M8 8.2v2M14 8.2v2", mouth: "M7.3 12.8Q11 16.6 14.7 12.8" },
      partial: { eyes: "M6.4 9.2Q8 10.8 9.6 9.2M12.4 9.2Q14 10.8 15.6 9.2", mouth: "M9.2 13.6Q11 15 12.8 13.6" },
      none: { eyes: "M6.4 9.8h3.2M12.4 9.8h3.2", mouth: "M10.1 14.3h1.8" }
    };
    var check = function (k, name) {
      var v = f[k];
      var st = v >= 1 ? "done" : v > 0 ? "partial" : "none";
      return {
        done: v >= 1,
        line: v > 0 ? "solid" : "dashed",
        ink: v >= 1 ? "#111113" : C[k],
        eyes: faceFor[st].eyes,
        mouth: faceFor[st].mouth,
        bg: v >= 1 ? C[k] : "transparent",
        bd: v > 0 ? C[k] : soft[k],
        label: v >= 1 ? name + " done today. Tap to undo." : "Check off " + name.toLowerCase() + " for today"
      };
    };

    var colors = ["#F2B482", "#B9B0F7", "#A6E0AE", "#FFFFFF"];
    var confetti = [];
    for (var i = 0; i < 16; i++) {
      confetti.push({
        deg: Math.round(i * 22.5 + (i % 2 ? 8 : -6)),
        anim: ["fly1", "fly2", "fly3"][i % 3],
        color: colors[i % 4], w: i % 3 ? 6 : 8, h: i % 3 ? 6 : 4, r: i % 3 ? "50%" : "1px",
        delay: (i % 5) * 0.03
      });
    }

    // [weekday, date, journal, meditation, exercise] — 1 done, 0.5 in progress, 0 none
    var raw = [
      ["Tue", 3, 1, 0, 1],
      ["Wed", 4, 1, 1, 0],
      ["Thu", 5, 0, 1, 1],
      ["Fri", 6, 1, 1, 0],
      ["Sat", 7, 1, 1, 1],
      ["Sun", 8, 1, 1, 1],
      ["Mon", 9, vToday(f.j), vToday(f.m), vToday(f.e)]
    ];
    var dot = function (v, k) { return v === 1 ? C[k] : v > 0 ? soft[k] : off; };
    var week = raw.map(function (r, i) {
      var isToday = i === raw.length - 1;
      var done = [r[2], r[3], r[4]].map(function (v, k) {
        return v === 1 ? names[k] : v > 0 ? names[k] + " in progress" : null;
      }).filter(Boolean);
      return {
        dow: r[0].charAt(0),
        date: r[1],
        circle: isToday ? "#ECEAE6" : "transparent",
        num: isToday ? "#111113" : "#A3A1A7",
        label: (isToday ? "Today, " : "") + r[0] + " " + r[1] + " November: " + (done.length ? done.join(", ") : "nothing logged"),
        j: dot(r[2], "j"),
        m: dot(r[3], "m"),
        e: dot(r[4], "e")
      };
    });

    return {
      week: week,
      blobs: blobs,
      confetti: confetti,
      jStatus: jStatus, mStatus: mStatus, eStatus: eStatus,
      jTap: tapOf.j, mTap: tapOf.m, eTap: tapOf.e,
      jc: check("j", "Journal"), mc: check("m", "Meditation"), ec: check("e", "Exercise"),
      moods: moods, moodStatus: moodStatus,
      jDot: f.j >= 1 ? C.j : f.j > 0 ? soft.j : "transparent",
      mDot: f.m >= 1 ? C.m : f.m > 0 ? soft.m : "transparent",
      eDot: f.e >= 1 ? C.e : f.e > 0 ? soft.e : "transparent",
      doneCount: doneCount,
      allLit: doneCount === 3,
      notLit: doneCount < 3,
      caption: doneCount === 3 ? "lit. Party in the middle!" : "complete · tap to check off"
    };
  }
}
</script>
</body>
</html>
