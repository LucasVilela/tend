<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add to board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&display=swap">
<style>
body{margin:0;background:#111113}
a{color:#ECEAE6}a:hover{color:#FFFFFF}
button,input,textarea{font:inherit;color:inherit}
[style*="border-radius: 50%"]:not(.anim):not(.blob-btn){border-radius:58% 42% 54% 46%/47% 55% 45% 53%!important}
[style*="border-radius: 999px"]{border-radius:26px 18px 24px 16px/18px 25px 16px 23px!important}
[style*="border-radius: 18px"]{border-radius:22px 15px 20px 14px/16px 21px 14px 19px!important}
[style*="border-radius: 16px"]{border-radius:20px 13px 18px 12px/14px 19px 12px 17px!important}
[style*="border-bottom: 1px solid"]{border-bottom-color:transparent!important;background-image:url(/_blob/e00e9539ee07a59e5be730af0b7432e9)!important;background-repeat:repeat-x!important;background-position:left bottom!important;background-size:96px 6px!important}
[style*="border-top: 1px solid"]{border-top-color:transparent!important;background-image:url(/_blob/e00e9539ee07a59e5be730af0b7432e9)!important;background-repeat:repeat-x!important;background-position:left top!important;background-size:96px 6px!important}
[style*="border-top: 1px solid"][style*="border-bottom: 1px solid"]{background-image:url(/_blob/e00e9539ee07a59e5be730af0b7432e9),url(/_blob/e00e9539ee07a59e5be730af0b7432e9)!important;background-position:left top,left bottom!important}
.blob-btn{animation:blobmorph 9s ease-in-out infinite}
@keyframes blobmorph{0%,100%{border-radius:56% 44% 52% 48%/48% 56% 44% 52%}50%{border-radius:46% 54% 45% 55%/55% 46% 54% 45%}}
[style*="border-width: 0px 0px 1px"]{border-bottom-color:transparent!important;background-image:url(/_blob/e00e9539ee07a59e5be730af0b7432e9)!important;background-repeat:repeat-x!important;background-position:left bottom!important;background-size:96px 6px!important}
[style*="border-width: 1px 0px;"]{border-top-color:transparent!important;border-bottom-color:transparent!important;background-image:url(/_blob/e00e9539ee07a59e5be730af0b7432e9),url(/_blob/e00e9539ee07a59e5be730af0b7432e9)!important;background-repeat:repeat-x!important;background-position:left top,left bottom!important;background-size:96px 6px!important}
@media (prefers-reduced-motion: reduce){.blob-btn{animation:none}}
input::placeholder,textarea::placeholder{color:#85838A;opacity:1}
input:focus,textarea:focus{outline:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #111113; color: #ECEAE6; font-family: Geist, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column">

<header style="flex-shrink: 0; padding: 52px 14px 0; display: grid; grid-template-columns: 64px minmax(0, 1fr) 64px; align-items: center">
<a href="Vision.dc.html" aria-label="Close without adding" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #A3A1A7; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<h1 style="margin: 0; text-align: center; font-size: 15px; line-height: 20px; font-weight: 500">Add to board</h1>
<span aria-hidden="true"></span>
</header>

<main style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 28px">

<div role="group" aria-label="Tile type" style="padding: 3px; border: 1px solid #26262A; border-radius: 999px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="2">
<button type="button" aria-pressed="{{k.pressed}}" onClick="{{k.pick}}" style="height: 44px; border: 0; border-radius: 999px; background: {{k.bg}}; color: {{k.fg}}; font-size: 15px; cursor: pointer">{{k.label}}</button>
</sc-for>
</div>

<sc-if value="{{isImage}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 24px">
<button type="button" style="height: 240px; border-radius: 18px; border: 1px dashed #3A3A40; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #A3A1A7; cursor: pointer">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M21 16l-5-5-9 9"></path></svg>
<span style="font-size: 15px; color: #ECEAE6">Choose a photo</span>
<span style="font-size: 13px">From Photos or Files</span>
</button>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="img-cap" style="display: flex; justify-content: space-between; font-size: 14px; line-height: 18px; color: #85838A">Caption <span>optional</span></label>
<input id="img-cap" type="text" placeholder="e.g. Learn to surf" style="height: 40px; border: 0; border-bottom: 1px solid #2A2A2F; background: transparent; padding: 0; font-size: 18px; font-weight: 300">
</div>
</div>
</sc-if>

<sc-if value="{{isText}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 28px">

<div role="group" aria-labelledby="lbl-h" style="display: flex; flex-direction: column; gap: 12px">
<span id="lbl-h" style="font-size: 14px; line-height: 18px; color: #85838A">Label</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{labels}}" as="l" hint-placeholder-count="5">
<button type="button" aria-pressed="{{l.pressed}}" onClick="{{l.pick}}" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid {{l.bd}}; background: {{l.bg}}; color: {{l.fg}}; font-size: 15px; cursor: pointer">{{l.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="txt" style="font-size: 14px; line-height: 18px; color: #85838A">Text</label>
<textarea id="txt" rows="2" placeholder="{{placeholder}}" value="{{text}}" onChange="{{onText}}" style="border: 0; border-bottom: 1px solid #2A2A2F; background: transparent; padding: 0 0 8px; resize: none; font-size: 22px; line-height: 30px; font-weight: 300; color: #ECEAE6"></textarea>
</div>

<sc-if value="{{isGoal}}" hint-placeholder-val="{{true}}">
<button type="button" style="min-height: 56px; margin-top: -8px; padding: 0; border: 0; border-bottom: 1px solid #222226; background: transparent; display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left">
<span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 16px; line-height: 20px; color: #ECEAE6">By when</span>
<span style="font-size: 13px; line-height: 18px; color: #85838A">Optional · just a date to keep in mind</span>
</span>
<span style="font-size: 15px; line-height: 20px; color: #A3A1A7">May 2027</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#85838A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; line-height: 18px; color: #85838A">On your board</span>
<div aria-hidden="true" style="width: 50%; box-sizing: border-box; border-radius: 16px; background: #18181C; padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: 0.08em; color: {{cap.color}}">{{cap.text}}</span>
<p style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 300; letter-spacing: -0.01em; color: {{preview.color}}; overflow-wrap: anywhere">{{preview.text}}</p>
</div>
</div>

</div>
</sc-if>

</main>

<div style="flex-shrink: 0; padding: 12px 24px 32px">
<a href="Vision.dc.html" style="height: 54px; border-radius: 999px; background: #ECEAE6; color: #111113; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 500; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
Add to board
</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    // The board is for looking and remembering — no tracking, so just two tile kinds.
    var kind = s.kind || "Text";
    var label = s.label || "Goal";
    var text = s.text != null ? s.text : "Run a half marathon";
    var kinds = ["Image", "Text"].map(function (k) {
      var on = k === kind;
      return { label: k, pressed: on, bg: on ? "#26262A" : "transparent", fg: on ? "#ECEAE6" : "#85838A", pick: function () { self.setState({ kind: k }); } };
    });
    // Each label sets the tile's look on the board. Accents rotate through the app colours.
    var defs = {
      "Goal": { cap: "GOAL · MAY", capColor: "#9CC5A1", ink: "#ECEAE6", ph: "Something you want to do" },
      "Mantra": { cap: "MANTRA", capColor: "#85838A", ink: "#D4A373", ph: "A line to come back to" },
      "Words for the year": { cap: "WORDS FOR THE YEAR", capColor: "#85838A", ink: "#ECEAE6", ph: "e.g. Steady · Present · Kind" },
      "Quote": { cap: "QUOTE", capColor: "#85838A", ink: "#A9A3D9", ph: "Words that move you" },
      "Reminder": { cap: "REMINDER", capColor: "#8FBCD9", ink: "#ECEAE6", ph: "Something to remember" }
    };
    var d = defs[label];
    var labels = Object.keys(defs).map(function (l) {
      var on = l === label;
      return {
        label: l, pressed: on,
        bg: on ? "#232327" : "transparent",
        bd: on ? "#ECEAE6" : "#2A2A2F",
        fg: on ? "#ECEAE6" : "#A3A1A7",
        pick: function () { self.setState({ label: l }); }
      };
    });
    return {
      kinds: kinds,
      isImage: kind === "Image",
      isText: kind === "Text",
      labels: labels,
      isGoal: label === "Goal",
      placeholder: d.ph,
      text: text,
      onText: function (e) { self.setState({ text: e.target.value }); },
      cap: { text: d.cap, color: d.capColor },
      preview: { text: text.trim() ? (label === "Quote" ? "“" + text.trim() + "”" : text.trim()) : d.ph, color: text.trim() ? d.ink : "#85838A" }
    };
  }
}
</script>
</body>
</html>
